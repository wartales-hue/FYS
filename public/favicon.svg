<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="opliraRingGradient" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#6C2BD9" />
    </linearGradient>
    <linearGradient id="signatureGrad" x1="42" y1="52" x2="68" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Background for app icon -->
  <rect width="120" height="120" rx="28" fill="#FFFFFF" />

  <!-- Outer Circular Gradient Ring -->
  <circle cx="60" cy="55" r="44" stroke="url(#opliraRingGradient)" stroke-width="10" fill="#FFFFFF" />

  <!-- Smartphone Device Frame (Black) -->
  <rect x="45" y="28" width="30" height="52" rx="5.5" fill="#0F172A" />

  <!-- Smartphone Screen (White) -->
  <rect x="48" y="34" width="24" height="39" rx="2" fill="#FFFFFF" />

  <!-- Phone Earpiece -->
  <rect x="56" y="30.5" width="8" height="1.5" rx="0.75" fill="#64748B" />

  <!-- Home Button / Indicator -->
  <circle cx="60" cy="76" r="1.6" fill="#E2E8F0" />

  <!-- Digital Cursive Signature 'li' on Screen -->
  <path d="M 52 54 C 53 46, 57 42, 58 43 C 59 44, 57 53, 57 57 C 59 53, 62 50, 65 52 C 67 53.5, 66 57, 69 56" stroke="url(#signatureGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="65" cy="47" r="1.2" fill="#0284C7" />

  <!-- Hand touching the smartphone screen -->
  <g id="hand-touch">
    <path d="M 64 54 C 62 52, 66 45, 71 49 L 77 57 C 80 59, 82 59, 84 62 C 87 66, 87 72, 84 76 L 78 81 C 75 83, 70 82, 67 77 L 61 69 C 60 67, 62 64, 65 64 L 70 64" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 73 63 C 76 65, 78 68, 79 71" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Subtitle text at bottom -->
  <text x="60" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0F172A" letter-spacing="-0.2">Oplira FYS</text>
</svg>
